[project]
name = "workcation-concierge"
version = "0.1.0"
description = "Architecture Conference 2026 Hands-on: Workcation & Smart Travel Concierge with Google ADK 2.0"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk>=2.15.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0",
    "google-genai>=1.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "google-agents-cli>=1.15.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workcation_concierge"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "src",
    "step0_minimal_agent",
    "step1_basic_agent",
    "step2_starter",
    "step2_workflow_agent",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["src", "."]

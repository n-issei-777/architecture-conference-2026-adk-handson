name: "workcation-concierge"
acli_version: "1.15.0"
agent_directory: "step2_workflow_agent"
region: "us-central1"
base_template: "adk_python"
language: "python"
framework: "google-adk"
create_params:
  root_agent_name: "workcation_concierge_workflow"
  app_name: "step2_workflow_agent"
  deployment_target: "agent_runtime"
  session_type: "in_memory"
  cicd_runner: "skip"
  is_a2a: false
  agent_gateway: false
  agent_guidance_filename: "GEMINI.md"
  agent_runtime:
    identity_default: "service_account"
  cloud_run:
    identity_default: "service_account"
